name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real secrets or private transcripts.** For redaction leaks or path-escape issues, use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what you saw.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Audit, Organization projects, Sharing / redaction, Transcript viewer, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: VsSession 0.1.0, VS Code 1.146, Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: sync
    attributes:
      label: Shared folder type
      options: [OneDrive / SharePoint, Network share (SMB), Git repository, Dropbox / Google Drive, Other, Not applicable]
